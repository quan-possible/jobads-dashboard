[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jobads-dashboard"
version = "0.1.0"
description = "Standalone labor-market dashboard (Next.js web + FastAPI) built from Vicinity job ads aggregates."
readme = "README.md"
requires-python = ">=3.10"
# Core: the data pipeline + the Python Plotly figure factories (jobads_dashboard.viz)
# that the FastAPI figure bridge serves. The web UI lives in web/ (Node).
dependencies = [
  "duckdb>=1.1.0",
  "pandas>=2.2.0",
  "plotly>=5.24.0",
  "pyarrow>=17.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "kaleido>=1.0.0",  # static PNG export for visual verification of viz figures
  "hypothesis>=6.0.0",  # property-based invariants for the pure viz transforms
]
api = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "httpx>=0.27.0",
  "pydantic>=2.8.0",
]

[project.scripts]
jobads-dashboard-refresh = "jobads_dashboard.dashboard.prepare:main"
jobads-dashboard = "jobads_dashboard.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
