services:
  - name: jobads-dashboard
    type: web
    runtime: docker
    plan: free
    region: oregon
    repo: https://github.com/quan-possible/jobads-dashboard
    branch: worktree-greenfield-aclmr
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # Web liveness probe (Next route handler), independent of the API/data.
    healthCheckPath: /healthz
    autoDeployTrigger: commit
