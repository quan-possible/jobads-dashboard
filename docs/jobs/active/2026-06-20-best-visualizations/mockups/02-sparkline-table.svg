    <text x="28" y="222" fill="#616a71" font-size="11">4</text><text x="46" y="222">Health</text><text x="420" y="222" text-anchor="end" font-family="ui-monospace,monospace">0.98M</text>
    <text x="28" y="258" fill="#616a71" font-size="11">5</text><text x="46" y="258">Education, law &amp; social</text><text x="420" y="258" text-anchor="end" font-family="ui-monospace,monospace">0.61M</text>
