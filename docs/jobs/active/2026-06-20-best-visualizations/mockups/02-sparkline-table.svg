  </g>
  <line x1="28" y1="88" x2="692" y2="88" stroke="#ece3da"/>

  <!-- rows -->
  <g font-size="13" font-weight="700" fill="#16242f">
    <text x="28" y="114" fill="#616a71" font-size="11">1</text><text x="46" y="114">Sales &amp; service</text><text x="420" y="114" text-anchor="end" font-family="ui-monospace,monospace">1.93M</text>
    <text x="28" y="150" fill="#616a71" font-size="11">2</text><text x="46" y="150">Trades &amp; transport</text><text x="420" y="150" text-anchor="end" font-family="ui-monospace,monospace">1.44M</text>
