    <polyline points="440,140.8 460,140.4 480,140.8 500,139.9 520,139 540,138.1 560,137.2 580,135.4 600,132.7"/>
    <polyline points="440,175 460,173.2 480,170.5 500,168.7 520,169.6 540,172.3 560,175 580,176.8 600,177.7"/>
    <polyline points="440,217.3 460,216.4 480,214.6 500,211.9 520,210.1 540,208.3 560,205.6 580,203.8 600,202"/>
    <polyline points="440,247.9 460,247.7 480,247.4 500,247 520,246.6 540,246.1 560,245.9 580,245.2 600,244.8"/>
    <polyline points="440,282.1 460,279.4 480,276.7 500,275.8 520,277.6 540,281.2 560,283.9 580,286.6 600,288.4"/>
