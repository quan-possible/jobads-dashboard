<svg viewBox="0 0 720 380" xmlns="http://www.w3.org/2000/svg" font-family="PT Sans, ui-sans-serif, system-ui, sans-serif">
  <rect width="720" height="380" fill="#fbf8f5"/>
  <rect x="10" y="10" width="700" height="360" rx="10" fill="#ffffff" stroke="#e3d6c8"/>
  <text x="28" y="38" font-size="9.5" letter-spacing="0.06em" font-weight="700" fill="#a25518">WAGES · DISTRIBUTION OVER TIME · THE TOP RE-ADD</text>
  <text x="28" y="58" font-size="15" font-weight="700" fill="#041c2c">Advertised hourly pay has risen — and spread out</text>
  <text x="28" y="74" font-size="11.5" fill="#5d6b74">Hourly wage · 25th–75th percentile band with median · all postings</text>

  <!-- gridlines + y labels -->
  <g stroke="#e6e0da" stroke-width="1">
    <line x1="56" y1="282.8" x2="630" y2="282.8"/>
    <line x1="56" y1="223.8" x2="630" y2="223.8"/>
    <line x1="56" y1="164.8" x2="630" y2="164.8"/>
    <line x1="56" y1="105.8" x2="630" y2="105.8"/>
  </g>
  <g font-size="9.5" fill="#616a71" font-family="ui-monospace,monospace">
    <text x="50" y="286" text-anchor="end">$20</text>
    <text x="50" y="227" text-anchor="end">$25</text>
    <text x="50" y="168" text-anchor="end">$30</text>
    <text x="50" y="109" text-anchor="end">$35</text>
  </g>

  <!-- COVID shade -->
  <rect x="285.6" y="92" width="34" height="238" fill="#5b7e85" opacity="0.12"/>
  <text x="302" y="104" font-size="8.5" text-anchor="middle" fill="#5d6b74">COVID-19</text>

  <!-- IQR band -->
  <polygon fill="#345961" opacity="0.14" points="56,212 113.4,206.1 170.8,200.2 228.2,194.3 285.6,188.4 343,170.7 400.4,147.1 457.8,123.5 515.2,105.8 572.6,94 630,82.2 630,271 572.6,276.9 515.2,282.8 457.8,288.7 400.4,294.6 343,300.5 285.6,304.04 228.2,306.4 170.8,312.3 113.4,315.84 56,318.2"/>

  <!-- p75 / p25 edges -->
  <polyline fill="none" stroke="#5b7e85" stroke-width="1.3" points="56,212 113.4,206.1 170.8,200.2 228.2,194.3 285.6,188.4 343,170.7 400.4,147.1 457.8,123.5 515.2,105.8 572.6,94 630,82.2"/>
  <polyline fill="none" stroke="#5b7e85" stroke-width="1.3" points="56,318.2 113.4,315.84 170.8,312.3 228.2,306.4 285.6,304.04 343,300.5 400.4,294.6 457.8,288.7 515.2,282.8 572.6,276.9 630,271"/>
  <!-- median -->
  <polyline fill="none" stroke="#041c2c" stroke-width="2.4" points="56,271 113.4,265.1 170.8,259.2 228.2,253.3 285.6,247.4 343,235.6 400.4,217.9 457.8,200.2 515.2,182.5 572.6,170.7 630,164.8"/>

  <!-- direct labels -->
  <text x="636" y="85" font-size="10.5" font-weight="700" fill="#5b7e85">P75</text>
  <text x="636" y="168" font-size="10.5" font-weight="700" fill="#041c2c">Median</text>
  <text x="636" y="274" font-size="10.5" font-weight="700" fill="#5b7e85">P25</text>

  <!-- x labels -->
  <g font-size="9.5" fill="#616a71">
    <text x="56" y="345" text-anchor="middle">2016</text>
    <text x="170.8" y="345" text-anchor="middle">2018</text>
    <text x="285.6" y="345" text-anchor="middle">2020</text>
    <text x="400.4" y="345" text-anchor="middle">2022</text>
    <text x="515.2" y="345" text-anchor="middle">2024</text>
    <text x="630" y="345" text-anchor="middle">2026</text>
  </g>

  <text x="10" y="366" font-size="11" fill="#5d6b74">Only p25/median/p75 exist (no p10/p90) — so an honest band + median line, not a fabricated box plot. Sliceable by occupation, industry, province.</text>
</svg>
