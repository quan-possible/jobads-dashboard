<svg viewBox="0 0 720 360" xmlns="http://www.w3.org/2000/svg" font-family="PT Sans, ui-sans-serif, system-ui, sans-serif">
  <rect width="720" height="360" fill="#fbf8f5"/>
  <rect x="10" y="10" width="700" height="340" rx="10" fill="#ffffff" stroke="#e3d6c8"/>
  <text x="28" y="38" font-size="9.5" letter-spacing="0.06em" font-weight="700" fill="#a25518">DEMAND, INDEXED · 2019 = 100</text>
  <text x="28" y="56" font-size="15" font-weight="700" fill="#041c2c">Alberta’s boom-bust against Ontario’s steady climb</text>

  <!-- gridlines -->
  <g stroke="#e6e0da" stroke-width="1">
    <line x1="56" y1="282.9" x2="620" y2="282.9"/>
    <line x1="56" y1="134.3" x2="620" y2="134.3"/>
  </g>
  <line x1="56" y1="208.6" x2="620" y2="208.6" stroke="#041c2c" stroke-width="1" stroke-dasharray="3,4" opacity="0.55"/>
  <g font-size="9.5" fill="#616a71" font-family="ui-monospace,monospace">
    <text x="50" y="286" text-anchor="end">60</text>
    <text x="50" y="212" text-anchor="end">100</text>
    <text x="50" y="138" text-anchor="end">140</text>
  </g>

  <!-- COVID shade -->
  <rect x="281.6" y="70" width="28" height="250" fill="#5b7e85" opacity="0.10"/>
  <text x="295" y="82" font-size="8.5" text-anchor="middle" fill="#5d6b74">2020</text>

  <!-- gray context -->
  <g fill="none" stroke="#d9d0c6" stroke-width="1.1">
    <polyline points="56,217.9 112.4,214.2 168.8,210.4 225.2,208.6 281.6,227.2 338,206.7 394.4,193.7 450.8,186.3 507.2,182.6 563.6,180.7 620,178.9"/>
    <polyline points="56,204.9 112.4,206.7 168.8,208.6 225.2,208.6 281.6,238.3 338,217.9 394.4,203 450.8,197.4 507.2,195.6 563.6,193.7 620,191.9"/>
    <polyline points="56,227.2 112.4,221.6 168.8,214.2 225.2,208.6 281.6,230.9 338,208.6 394.4,190 450.8,178.9 507.2,171.4 563.6,167.7 620,164"/>
    <polyline points="56,190 112.4,197.4 168.8,203 225.2,208.6 281.6,245.7 338,223.4 394.4,208.6 450.8,201.2 507.2,199.3 563.6,197.4 620,195.6"/>
  </g>

  <!-- accent: Ontario (teal), Alberta (orange) -->
  <polyline fill="none" stroke="#345961" stroke-width="2.2" points="56,230.9 112.4,223.4 168.8,216 225.2,208.6 281.6,234.6 338,201.2 394.4,171.4 450.8,156.6 507.2,149.2 563.6,145.4 620,141.7"/>
  <polyline fill="none" stroke="#cf7730" stroke-width="2.2" points="56,152.9 112.4,175.2 168.8,193.7 225.2,208.6 281.6,260.6 338,216 394.4,175.2 450.8,160.3 507.2,171.4 563.6,175.2 620,167.7"/>

  <text x="626" y="145" font-size="10.5" font-weight="700" fill="#345961">Ontario</text>
  <text x="626" y="171" font-size="10.5" font-weight="700" fill="#cf7730">Alberta</text>

  <!-- x labels -->
  <g font-size="9.5" fill="#616a71">
    <text x="56" y="336" text-anchor="middle">2016</text>
    <text x="168.8" y="336" text-anchor="middle">2018</text>
    <text x="281.6" y="336" text-anchor="middle">2020</text>
    <text x="394.4" y="336" text-anchor="middle">2022</text>
    <text x="507.2" y="336" text-anchor="middle">2024</text>
    <text x="620" y="336" text-anchor="middle">2026</text>
  </g>

  <text x="10" y="354" font-size="11" fill="#5d6b74">Rebasing removes scale gaps so slope = growth rate. Gray the context, colour the story, label at the line end — no legend, event shading for context.</text>
</svg>
