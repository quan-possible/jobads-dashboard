<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:18px 22px;background:var(--canvas)}</style></head><body><div style="display:flex;gap:12px"><div style="flex:1;min-width:70px"><div style="height:56px;border-radius:8px;background:var(--canvas);border:1px solid var(--card-border)"></div><div class="t-caption" style="font-weight:700;margin-top:6px;color:var(--ink)">Canvas</div><div class="t-caption num" style="color:var(--ink-faint)">--canvas</div></div><div style="flex:1;min-width:70px"><div style="height:56px;border-radius:8px;background:var(--surface);border:1px solid var(--card-border)"></div><div class="t-caption" style="font-weight:700;margin-top:6px;color:var(--ink)">Surface</div><div class="t-caption num" style="color:var(--ink-faint)">--surface</div></div><div style="flex:1;min-width:70px"><div style="height:56px;border-radius:8px;background:var(--surface-alt);border:1px solid var(--card-border)"></div><div class="t-caption" style="font-weight:700;margin-top:6px;color:var(--ink)">Surface alt</div><div class="t-caption num" style="color:var(--ink-faint)">--surface-alt</div></div><div style="flex:1;min-width:70px"><div style="height:56px;border-radius:8px;background:var(--surface-navy);border:1px solid var(--card-border)"></div><div class="t-caption" style="font-weight:700;margin-top:6px;color:var(--ink)">Surface navy</div><div class="t-caption num" style="color:var(--ink-faint)">--surface-navy</div></div></div></body></html>
