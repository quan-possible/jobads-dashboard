<!-- @dsCard group="Colors" viewport="700x150" subtitle="Growth / cooling pair with redundant arrows and labels + warm lines" name="Status & lines" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:18px 22px;background:var(--canvas)}</style></head><body><div style="display:flex;gap:12px;align-items:flex-start">
<div style="flex:1"><span class="num t-body" style="font-weight:700;color:var(--pos)">▲ 3.1%</span><div class="t-caption" style="color:var(--ink-faint);margin-top:2px">--pos growth</div></div>
<div style="flex:1"><span class="num t-body" style="font-weight:700;color:var(--neg)">▼ 8.4%</span><div class="t-caption" style="color:var(--ink-faint);margin-top:2px">--neg cooling</div></div>
<div style="flex:1;min-width:70px"><div style="height:56px;border-radius:8px;background:var(--hairline);border:1px solid var(--card-border)"></div><div class="t-caption" style="font-weight:700;margin-top:6px;color:var(--ink)">Hairline</div><div class="t-caption num" style="color:var(--ink-faint)">--hairline</div></div><div style="flex:1;min-width:70px"><div style="height:56px;border-radius:8px;background:var(--card-border);border:1px solid var(--card-border)"></div><div class="t-caption" style="font-weight:700;margin-top:6px;color:var(--ink)">Card border</div><div class="t-caption num" style="color:var(--ink-faint)">--card-border</div></div><div style="flex:1;min-width:70px"><div style="height:56px;border-radius:8px;background:var(--chart-grid);border:1px solid var(--card-border)"></div><div class="t-caption" style="font-weight:700;margin-top:6px;color:var(--ink)">Chart grid</div><div class="t-caption num" style="color:var(--ink-faint)">--chart-grid</div></div><div style="flex:1;min-width:70px"><div style="height:56px;border-radius:8px;background:var(--chart-axis);border:1px solid var(--card-border)"></div><div class="t-caption" style="font-weight:700;margin-top:6px;color:var(--ink)">Chart axis</div><div class="t-caption num" style="color:var(--ink-faint)">--chart-axis</div></div></div></body></html>
