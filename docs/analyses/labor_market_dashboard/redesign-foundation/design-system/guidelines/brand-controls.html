<!-- @dsCard group="Brand" viewport="800x150" subtitle="Square analytical controls, pill CTA, orange focus ring" name="Controls & focus" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:18px 22px;background:var(--canvas)}</style></head><body><div style="display:flex;gap:14px;align-items:center;flex-wrap:wrap">
<button class="control t-meta" style="border:1px solid var(--card-border);background:var(--surface);padding:8px 16px;font-weight:700;text-transform:uppercase;letter-spacing:.02em;color:var(--navy);font-family:inherit;cursor:pointer">Analytical control</button>
<button class="control t-meta" style="border:1px solid var(--card-border);background:var(--surface);padding:8px 16px;font-weight:700;text-transform:uppercase;letter-spacing:.02em;color:var(--navy);font-family:inherit;outline:2px solid var(--orange);outline-offset:2px">Focused control</button>
<button class="cta-pill t-meta" style="border:1px solid var(--orange);background:var(--navy-deep);padding:9px 18px;font-weight:700;color:var(--ink-invert);font-family:inherit;cursor:pointer">Primary CTA →</button>
<span class="t-body" style="background:var(--orange-soft);color:var(--navy-deep);padding:2px 6px">selected text</span>
<span class="t-caption" style="color:var(--ink-faint)">square for dense analysis · pill for primary CTA</span></div></body></html>
