const { KpiTile } = NS;
const s = (f) => Array.from({length:24},(_,i)=>f(i));

    <KpiTile label="Vs last year" value="8.4%" valueTrend={-8.4} context="year over year" spark={s(i=>20-i*0.7+3*Math.sin(i*1.1))} />

  </div>
);
</script></body></html>
